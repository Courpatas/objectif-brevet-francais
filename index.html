<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2346a8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Préparation à l'épreuve de français du brevet 2027 : grammaire, orthographe, dictées et expression écrite.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Objectif Brevet Français</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout : une colonne de lecture (max 820px), barre d'onglets collante, cartes réservées aux éléments actifs (séance, exercice). Encre bleue de l'élève, stylo rouge du correcteur, papier Seyès pour écrire. */
:root{
  --paper:#f5f7fb; --card:#ffffff; --ink:#18213b; --muted:#59627c; --line:#dde2ee;
  --blue:#2346a8; --blue-soft:#e6ecfb; --red:#c4302a; --red-soft:#fbe9e7;
  --green:#1d7650; --green-soft:#e3f4ec; --amber:#a75f00; --amber-soft:#fdf1dc;
  --seyes:rgba(35,70,168,.13); --seyes-strong:rgba(35,70,168,.28); --margin:rgba(196,48,42,.35);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f121b; --card:#171b27; --ink:#e6e9f2; --muted:#9aa2bb; --line:#293044;
  --blue:#8fa8ff; --blue-soft:#1d2645; --red:#ff7d70; --red-soft:#3a1d1c;
  --green:#62d09e; --green-soft:#16332a; --amber:#f2b552; --amber-soft:#3a2b12;
  --seyes:rgba(143,168,255,.10); --seyes-strong:rgba(143,168,255,.22); --margin:rgba(255,125,112,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f121b; --card:#171b27; --ink:#e6e9f2; --muted:#9aa2bb; --line:#293044;
  --blue:#8fa8ff; --blue-soft:#1d2645; --red:#ff7d70; --red-soft:#3a1d1c;
  --green:#62d09e; --green-soft:#16332a; --amber:#f2b552; --amber-soft:#3a2b12;
  --seyes:rgba(143,168,255,.10); --seyes-strong:rgba(143,168,255,.22); --margin:rgba(255,125,112,.35);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-inner{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:800}
.brand b span{color:var(--red)}
.sync{font-size:.78rem;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:8px 10px 10px;border-bottom:3px solid transparent;font-weight:700;font-size:.93rem;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--blue);border-bottom-color:var(--blue)}

main{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px;display:flex;flex-direction:column;gap:28px}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:1.08rem;color:var(--muted);max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

.btn{appearance:none;border:0;background:var(--blue);color:var(--card);font-weight:700;padding:11px 18px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn.quiet{background:var(--blue-soft);color:var(--blue)}
.btn.small{padding:7px 12px;font-size:.9rem}

.linkcard{text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.linkcard:hover{border-color:var(--blue)}
.linkcard h3{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.none{background:transparent;border:1px dashed var(--line);color:var(--muted)}

.banner{border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-weight:700}
.banner.warn{background:var(--amber-soft);color:var(--amber)}
.banner.ok{background:var(--green-soft);color:var(--green)}
.banner.info{background:var(--blue-soft);color:var(--blue)}
.banner p{font-weight:400;color:var(--ink)}

/* semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center}
.day b{font-size:.95rem;color:var(--ink)}
.day.planned{border-color:var(--blue);border-width:2px}
.day.done{background:var(--green-soft);border-color:var(--green)}
.day.done b{color:var(--green)}
.day.today{box-shadow:0 0 0 3px var(--blue-soft)}
.day .mark{height:16px;font-weight:700}

/* progression des leçons */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lesson{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px}
.lesson:hover{border-color:var(--blue)}
.lesson .num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--blue-soft);color:var(--blue);font-variant-numeric:tabular-nums}
.lesson.s-ok .num{background:var(--green-soft);color:var(--green)}
.lesson.s-mid .num{background:var(--amber-soft);color:var(--amber)}
.lesson.s-low .num{background:var(--red-soft);color:var(--red)}
.lesson .txt{min-width:0;display:flex;flex-direction:column}
.lesson .txt span{font-size:.8rem;color:var(--muted)}
.wk{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:.9rem;grid-column:1/-1;margin-top:6px}

/* séance */
.session-bar{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem}
.steps span{padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--muted);font-weight:700}
.steps span.on{background:var(--blue);color:var(--card)}
.steps span.done{background:var(--green-soft);color:var(--green)}
.timer{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .4s}

.rule{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 16px;padding:12px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule .k{font-family:var(--f-display);font-weight:700}
@media (max-width:560px){.rule{grid-template-columns:1fr}}
.astuce{background:var(--amber-soft);border-radius:10px;padding:12px 14px;color:var(--ink)}
.astuce::before{content:"Astuce";display:block;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}

.ex{display:flex;flex-direction:column;gap:14px}
.ex .q{font-size:1.15rem}
.choix{display:grid;gap:8px}
.choice{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:1.02rem}
.choice:hover:not([disabled]){border-color:var(--blue)}
.choice.right{border-color:var(--green);background:var(--green-soft)}
.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.choice[disabled]{cursor:default}
form.saisie{display:flex;gap:8px;flex-wrap:wrap}
form.saisie input{flex:1 1 200px;min-width:0;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
form.saisie input:focus{border-color:var(--blue);outline:none}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-left:5px solid}
.fb.ok{background:var(--green-soft);border-color:var(--green)}
.fb.ko{background:var(--red-soft);border-color:var(--red)}
.fb strong{font-family:var(--f-display);font-size:1.05rem}
.fb.ok strong{color:var(--green)}
.fb.ko strong{color:var(--red)}
.fb s{color:var(--red)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--green)}
.dots i.ko{background:var(--red)}
.dots i.cur{background:var(--blue)}

/* papier Seyès */
.seyes{width:100%;min-height:260px;resize:vertical;font:inherit;font-size:1.1rem;line-height:32px;padding:4px 14px 4px 54px;border:1px solid var(--line);border-radius:10px;color:var(--ink);
  background-color:var(--card);
  background-image:linear-gradient(90deg,transparent 40px,var(--margin) 40px,var(--margin) 42px,transparent 42px),
    linear-gradient(var(--seyes-strong) 1px,transparent 1px),
    linear-gradient(var(--seyes) 1px,transparent 1px);
  background-size:100% 100%,100% 32px,100% 8px;background-position:0 0,0 31px,0 7px;background-attachment:local}
.seyes:focus{outline:none;border-color:var(--blue)}
.dict-out{font-size:1.12rem;line-height:2.1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.w-ok{}
.w-sub{color:var(--red);font-weight:700;text-decoration:underline wavy var(--red);text-underline-offset:5px}
.w-miss{color:var(--amber);font-weight:700;border-bottom:2px dashed var(--amber)}
.w-given{display:inline-block;font-size:.78rem;color:var(--red);text-decoration:line-through;transform:translateY(-.7em);margin-right:2px}
mark.err{background:var(--red-soft);color:var(--ink);border-bottom:2px solid var(--red);padding:0 2px;border-radius:3px}
mark.err sup{color:var(--red);font-weight:700;font-size:.7rem;margin-left:2px}

table.errs{width:100%;border-collapse:collapse;font-size:.95rem}
table.errs th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.errs td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
.from{color:var(--red);text-decoration:line-through}
.to{color:var(--green);font-weight:700}

.notions{display:grid;gap:0}
.notion{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:4px 16px;padding:11px 0;border-top:1px solid var(--line)}
.notion b{font-family:var(--f-display)}
@media (max-width:560px){.notion{grid-template-columns:1fr}}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
details{border:1px solid var(--line);border-radius:10px;background:var(--card)}
details summary{cursor:pointer;padding:12px 14px;font-weight:700}
details > div{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.wordbox{display:flex;flex-wrap:wrap;gap:6px}
.wordbox button{border:1px dashed var(--blue);background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:4px 10px;font-size:.88rem;cursor:pointer}
.counter{font-size:.88rem;font-variant-numeric:tabular-nums}
.score{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1rem;color:var(--muted);font-weight:500}
.texte-source{border-left:4px solid var(--blue);padding:10px 14px;background:var(--blue-soft);border-radius:0 10px 10px 0;font-style:italic}
.struct{display:grid;gap:10px}
.part{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.part .pts{font-family:var(--f-display);font-weight:800;font-size:1.5rem;color:var(--blue);font-variant-numeric:tabular-nums}
.part .pts small{display:block;font-size:.8rem;color:var(--muted);font-weight:500}
@media (max-width:480px){.part{grid-template-columns:1fr}}
.pre{white-space:pre-wrap}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}.bar i{transition:none}}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;background:var(--card)}
input[type=time]{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea.ics{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:.75rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:8px}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.hist div:first-child{border-top:0}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><b>Objectif Brevet <span>Français</span></b><span class="sync" id="sync">Progression enregistrée sur cet appareil</span></div>
    <nav class="tabs" id="tabs">
      <a href="#accueil" data-r="accueil">Ma semaine</a>
      <a href="#langue" data-r="langue">Orthographe &amp; grammaire</a>
      <a href="#expression" data-r="expression">Expression écrite</a>
      <a href="#themes" data-r="themes">Thèmes du programme</a>
      <a href="#epreuve" data-r="epreuve">L'épreuve</a>
    </nav>
  </div>
</header>
<main id="view"></main>

<script src="contenu.js"></script>
<script>
/* ---------- utilitaires ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const norm = s => String(s).trim().replace(/[’`ʼ]/g, "'").replace(/\s+/g, " ").replace(/[.!?]+$/, "").toLowerCase();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = n => String(n).padStart(2, "0");
const dayKey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const JOURS = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
const isoDow = d => (d.getDay() + 6) % 7; // 0 = lundi
function mondayOf(d) { const m = new Date(d); m.setHours(0,0,0,0); m.setDate(m.getDate() - isoDow(m)); return m; }
function frDate(k) { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }); }

/* ---------- état et sauvegarde ---------- */
const KEY = "objectif-brevet-fr-v1";
const fresh = () => ({ lecons: {}, seances: [], erreurs: [], quiz: {}, ecrits: [], rappel: { jours: [0, 2, 4], heure: "17:30" } });
let S = fresh();
try { const t = localStorage.getItem(KEY); if (t) S = Object.assign(fresh(), JSON.parse(t)); } catch (e) {}
let docRef = null, chain = Promise.resolve();
function setSync(txt) { const el = $("#sync"); if (el) el.textContent = txt; }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (docRef) {
    const body = JSON.parse(JSON.stringify(S));
    chain = chain.then(() => docRef.set(body)).then(() => setSync("Progression enregistrée en ligne")).catch(() => setSync("Enregistrée sur cet appareil (connexion indisponible)"));
  }
}
(async () => {
  try {
    if (!window.claude) return;
    const db = await claude.use("db");
    if (!db) return;
    const ref = db.doc("suivi/eleve");
    const snap = await ref.get();
    docRef = ref;
    if (snap.exists) {
      const d = JSON.parse(JSON.stringify(snap.data()));
      if ((d.seances || []).length >= S.seances.length) { S = Object.assign(fresh(), d); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
      else save();
    } else if (S.seances.length || Object.keys(S.lecons).length || S.ecrits.length) save();
    setSync("Progression enregistrée en ligne");
    if (!busy()) render();
  } catch (e) { docRef = null; }
})();

/* ---------- calcul de la semaine ---------- */
function weekInfo() {
  const now = new Date(), mon = mondayOf(now), today = isoDow(now);
  const done = new Set(S.seances.filter(s => { const [y,m,d] = s.d.split("-").map(Number); return new Date(y, m-1, d) >= mon; }).map(s => s.d));
  const doneCount = S.seances.filter(s => { const [y,m,d] = s.d.split("-").map(Number); return new Date(y, m-1, d) >= mon; }).length;
  const plan = S.rappel.jours.slice().sort();
  const [hh, mm] = S.rappel.heure.split(":").map(Number);
  const pastPlanned = plan.filter(j => j < today || (j === today && (now.getHours() * 60 + now.getMinutes()) >= hh * 60 + mm)).length;
  const days = JOURS.map((n, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return { n, num: d.getDate(), key: dayKey(d), planned: plan.includes(i), done: done.has(dayKey(d)), today: i === today }; });
  return { days, doneCount: Math.min(doneCount, 99), objectif: plan.length, retard: Math.max(0, pastPlanned - doneCount), todayPlanned: plan.includes(today), doneToday: done.has(dayKey(now)) };
}
function nextLesson() {
  const notDone = LECONS.find(l => !S.lecons[l.id]);
  if (notDone) return notDone;
  return LECONS.slice().sort((a, b) => ratio(a.id) - ratio(b.id))[0];
}
function ratio(id) { const r = S.lecons[id]; return r ? r.score / r.total : -1; }
function lessonClass(id) { const r = ratio(id); if (r < 0) return ""; return r >= .8 ? "s-ok" : r >= .55 ? "s-mid" : "s-low"; }

/* ---------- routeur ---------- */
let session = null, timerId = null;
const busy = () => !!session && session.step !== "bilan" && location.hash.startsWith("#lecon-");
function render() {
  const h = (location.hash || "#accueil").slice(1);
  const base = h.split("-")[0];
  const tab = { accueil: "accueil", langue: "langue", lecon: "langue", expression: "expression", ecrire: "expression", themes: "themes", theme: "themes", epreuve: "epreuve" }[base] || "accueil";

function buildIcs() {
  const codes = ["MO", "TU", "WE", "TH", "FR", "SA", "SU"];
  const jours = S.rappel.jours.slice().sort();
  const [hh, mm] = S.rappel.heure.split(":");
  const d = new Date(); d.setHours(0,0,0,0);
  for (let i = 0; i < 8; i++) { if (jours.includes(isoDow(d))) break; d.setDate(d.getDate() + 1); }
  const ymd = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Objectif Brevet Francais//FR","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:objectif-brevet-fr-" + Date.now() + "@rappel", "DTSTAMP:" + stamp, "DTSTART:" + ymd + "T" + hh + mm + "00", "DURATION:PT20M",
    "RRULE:FREQ=WEEKLY;BYDAY=" + jours.map(j => codes[j]).join(",") + ";UNTIL=20270705T000000Z",
    "SUMMARY:Séance de français (20 min)", "DESCRIPTION:Ouvre Objectif Brevet Français et fais ta séance de grammaire et d'orthographe.",
    "BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:C'est l'heure de ta séance de français (20 min)","END:VALARM",
    "BEGIN:VALARM","TRIGGER:PT2H","ACTION:DISPLAY","DESCRIPTION:As-tu fait ta séance de français aujourd'hui ?","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
}
async function addToCalendar() {
  const ics = buildIcs(), msg = $("#icsMsg");
  let dl = null;
  try { dl = window.claude ? await claude.use("downloads") : null; } catch (e) {}
  if (dl) {
    try { await dl.save({ filename: "rappels-francais.ics", data: ics }); msg.textContent = "Fichier prêt : ouvre-le pour l'ajouter à ton agenda."; return; }

/* ---------- widget d'exercice (feedback riche) ---------- */
let uid = 0;
function exWidget(ex, opts, onDone) {
  const el = document.createElement("div"); el.className = "ex"; const id = "rep-" + (++uid);
  const order = ex.t === "qcm" ? shuffle(ex.c.map((_, i) => i)) : null;
  el.innerHTML = (opts.label ? `<span class="eyebrow">${opts.label}</span>` : "") + `<p class="q">${ex.q}</p>` +
    (ex.t === "qcm" ? `<div class="choix">${order.map(i => `<button class="choice" data-i="${i}">${esc(ex.c[i])}</button>`).join("")}</div>`
      : `<form class="saisie"><label class="eyebrow" for="${id}" style="flex-basis:100%">Ta réponse</label><input id="${id}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn">Valider</button></form>`) +
    `<div class="fb" hidden></div>`;
  const fb = $(".fb", el);
  function finish(ok, given) {
    const right = ex.t === "qcm" ? ex.c[ex.r] : ex.r[0];
    let html;
    if (ok) html = `<strong>${["Bravo !", "Exact !", "Parfait !", "Bien vu !"][Math.floor(Math.random() * 4)]}</strong><p>${ex.e}</p>`;
    else {
      let hint = "";
      if (ex.t === "saisie") {
        const g = norm(given);
        if (!g) hint = "<p>Tu n'as rien écrit : lis bien l'explication puis retiens la bonne forme.</p>";
        else if (ex.r.some(r => strip(norm(r)) === strip(g))) hint = "<p><b>Presque !</b> Seul l'accent est faux. Au brevet, un accent oublié compte comme une erreur.</p>";
        else if (ex.r.some(r => norm(r).replace(/[sxe]$/, "") === g.replace(/[sxe]$/, ""))) hint = "<p><b>Presque !</b> C'est la terminaison qui pose problème : vérifie l'accord.</p>";
      }
      html = `<strong>Pas tout à fait.</strong><p>${given !== undefined ? `Ta réponse : <s>${esc(given || "(vide)")}</s> → ` : ""}la bonne réponse est <b>${esc(right)}</b>.</p><p>${ex.e}</p>${hint}${opts.astuce ? `<div class="astuce">${opts.astuce}</div>` : ""}`;
    }
    fb.className = "fb " + (ok ? "ok" : "ko"); fb.innerHTML = html; fb.hidden = false;
    const next = document.createElement("button"); next.className = "btn"; next.textContent = opts.nextLabel || "Continuer";
    next.onclick = () => onDone(ok); fb.appendChild(next); next.focus();
  }
  if (ex.t === "qcm") el.querySelectorAll(".choice").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.i), ok = i === ex.r;
    el.querySelectorAll(".choice").forEach(x => { x.disabled = true; if (Number(x.dataset.i) === ex.r) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    finish(ok);
  });
  else $("form", el).onsubmit = e => {
    e.preventDefault(); const inp = $("input", el); const g = inp.value;
    if (!g.trim()) { inp.focus(); return; }
    inp.disabled = true; $("button", el).disabled = true;
    finish(ex.r.some(r => norm(r) === norm(g)), g);
  };
  setTimeout(() => { const i = $("input", el); if (i) i.focus(); }, 30);
  return el;
}

/* ---------- dictée ---------- */
const WORD = /[A-Za-zÀ-ÖØ-öø-ÿŒœÆæ0-9]+(?:['’-][A-Za-zÀ-ÖØ-öø-ÿŒœÆæ0-9]+)*/g;
const EQUIV = { "paraît": "parait", "parait": "paraît" };
const wn = w => w.replace(/’/g, "'").toLowerCase();
const same = (a, b) => { a = wn(a); b = wn(b); return a === b || EQUIV[a] === b; };

function subCost(a, b) { if (same(a, b)) return 0; const x = strip(wn(a)), y = strip(wn(b)); if (x === y) return .3; const dist = lev(x, y); return dist <= Math.max(1, Math.floor(Math.max(x.length, y.length) / 2)) ? .6 + dist * .05 : 1.6; }
function compareWords(exp, got) {
  const n = exp.length, m = got.length, D = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = 1; i <= n; i++) D[i][0] = i; for (let j = 1; j <= m; j++) D[0][j] = j;
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) D[i][j] = Math.min(D[i-1][j] + 1, D[i][j-1] + 1, D[i-1][j-1] + subCost(exp[i-1], got[j-1]));
  const status = new Array(n).fill(null), extra = []; let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && Math.abs(D[i][j] - (D[i-1][j-1] + subCost(exp[i-1], got[j-1]))) < 1e-9) { status[i-1] = same(exp[i-1], got[j-1]) ? { t: "ok" } : { t: "sub", g: got[j-1] }; i--; j--; }
    else if (i > 0 && Math.abs(D[i][j] - (D[i-1][j] + 1)) < 1e-9) { status[i-1] = { t: "miss" }; i--; }
    else { extra.unshift(got[j-1]); j--; }
  }
  return { status, extra };
}
function drawDictee(L, st) {
  const phrases = L.dictee.texte.match(/[^.!?;]+[.!?;]+(\s*»)?/g) || [L.dictee.texte];
  const voix = "speechSynthesis" in window;
  st.innerHTML = `<div class="card">

}
function fallbackFeedback(E, short) {
  return `${short ? "" : `<h2>Correction détaillée</h2><p>${window.claude ? "La correction automatique détaillée n'est pas disponible sur cet appareil." : "Relis maintenant ton texte avec la grille ci-dessous, un point à la fois."} ${window.claude ? " Relis ton texte avec cette grille, puis compare avec l'exemple de réponse en bas de page." : " Ensuite, ouvre l'exemple de réponse en bas de page et compare : qu'est-ce qui est mieux dit ?"}</p>`}
  <h3>Grille de relecture</h3><ul class="clean">${E.criteres.map(c => `<li>☐ ${esc(c)}</li>`).join("")}<li>☐ Chaque verbe est accordé avec son sujet</li><li>☐ Les participes passés sont bien écrits (-é ou -er ? accord ?)</li><li>☐ Les homophones sont vérifiés (a/à, et/est, son/sont, ce/se…)</li><li>☐ Chaque phrase commence par une majuscule et finit par un point</li></ul>`;
}
function highlight(txt, errs) {
  const ranges = [];
  errs.forEach((e, n) => {
    const x = String(e.extrait || "").trim(); if (!x) return;
    let i = txt.indexOf(x); if (i < 0) i = txt.toLowerCase().indexOf(x.toLowerCase());
    while (i >= 0 && ranges.some(r => i < r.b && i + x.length > r.a)) { const j = txt.indexOf(x, i + 1); i = j; }
    if (i >= 0) ranges.push({ a: i, b: i + x.length, n: n + 1 });
  });
  ranges.sort((p, q) => p.a - q.a);
  let out = "", pos = 0;
  ranges.forEach(r => { out += esc(txt.slice(pos, r.a)) + `<mark class="err">${esc(txt.slice(r.a, r.b))}<sup>${r.n}</sup></mark>`; pos = r.b; });
  return out + esc(txt.slice(pos));
}
function renderFeedback(r, txt, E) {
  const errs = Array.isArray(r.erreurs) ? r.erreurs : [], expr = Array.isArray(r.expression) ? r.expression : [], pf = Array.isArray(r.points_forts) ? r.points_forts : [];
  const note = Number.isFinite(Number(r.note)) ? Math.round(Number(r.note)) : null;
  const c = r.consigne || {};
  return `<div class="row between"><h2>Correction détaillée</h2>${note != null ? `<div class="score">${note}<small> / 10</small></div>` : ""}</div>
  ${r.bravo ? `<div class="banner ok"><div>${esc(r.bravo)}${r.commentaire_note ? `<p>${esc(r.commentaire_note)}</p>` : ""}</div></div>` : ""}
  <div><span class="eyebrow">La consigne</span><p><span class="chip ${c.respectee ? "ok" : "warn"}">${c.respectee ? "Respectée" : "Pas complètement respectée"}</span> ${esc(c.commentaire || "")}</p></div>
  ${pf.length ? `<div><span class="eyebrow">Ce qui est réussi</span><ul class="clean">${pf.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>` : ""}
  <div><span class="eyebrow">Ton texte annoté</span><div class="dict-out pre" style="line-height:1.9">${highlight(txt, errs)}</div></div>
  ${errs.length ? `<div><span class="eyebrow">${errs.length} erreur${errs.length > 1 ? "s" : ""} de langue expliquée${errs.length > 1 ? "s" : ""}</span><div class="tablewrap"><table class="errs"><thead><tr><th>N°</th><th>Tu as écrit</th><th>Correction</th><th>La règle</th></tr></thead><tbody>${errs.map((e, i) => `<tr><td><b>${i + 1}</b></td><td class="from">${esc(e.extrait)}</td><td class="to">${esc(e.correction)}</td><td><span class="chip">${esc(e.type || "")}</span><br>${esc(e.regle)}</td></tr>`).join("")}</tbody></table></div></div>` : `<div class="banner ok"><div>Aucune erreur de langue relevée. Bravo !</div></div>`}
  ${expr.length ? `<div><span class="eyebrow">Pour mieux t'exprimer</span><ul class="clean">${expr.map(x => `<li>${esc(x.conseil)}${x.exemple ? `<br><span class="muted">Par exemple :</span> <i>${esc(x.exemple)}</i>` : ""}</li>`).join("")}</ul></div>` : ""}
  ${r.priorite ? `<div class="astuce">${esc(r.priorite)}</div>` : ""}
  ${r.version_amelioree ? `<details><summary>Voir ton texte corrigé et amélioré</summary><div><p class="pre">${esc(r.version_amelioree)}</p><p class="small muted">Compare phrase par phrase avec ton texte : repère ce qui a changé et pourquoi.</p></div></details>` : ""}
  <div class="row"><button class="btn quiet" onclick="document.getElementById('ecrit').focus();window.scrollTo({top:0,behavior:'smooth'})">Améliorer mon texte</button><a class="btn ghost" href="#expression">Autre exercice</a></div>`;
}
